<!DOCTYPE html>
<html>
    <head>
        <title>Test chemical drawing</title>
        <script type="module">
            import { MoleculeEditor, SmilesConverter, MolConverter, MW, Formula, defaultStyle } from "./src/main.ts";
            let d;
            let mol_converter;
            let smiles_converter;
            const style_fields = Object.keys(defaultStyle).filter((k) => !["name", "themes"].includes(k));
            window.init = function() {
                d = new MoleculeEditor({ stage: document.getElementById("chemical") });
                d.onchange = onChange;
                smiles_converter = new SmilesConverter();
                mol_converter = new MolConverter();
                renderStyleControls();
                renderThemeControls();
                onChange();
            };

            function onChange() {
                const mw = new MW(d.graph).compute();
                document.getElementById("mw").innerHTML = mw ? `Molecular weight: ${mw.toFixed(2)}` : "";
                const composition = new Formula(d.graph).compute_as_html();
                document.getElementById("composition").innerHTML = composition ? `Composition: ${composition}` : "";
            }

            window.onChange = onChange;

            window.clearDrawing = function() {
                clearErrors();
                d.clear();
            };

            window.getMol = function() {
                clearErrors();
                try {
                    document.getElementById("moltxt").value = d.save(mol_converter);
                }
                catch (e) {
                    document.getElementById("error").innerHTML = e;
                }
            };

            window.readMol = function() {
                clearErrors();
                try {
                    d.load(document.getElementById("moltxt").value, mol_converter);
                }
                catch (e) {
                    document.getElementById("error").innerHTML = e;
                }
            };

            window.getSmiles = function() {
                clearErrors();
                try {
                    document.getElementById("smiles").value = d.save(smiles_converter);
                }
                catch (e) {
                    document.getElementById("error").innerHTML = e;
                }
            };

            window.readSmiles = function() {
                clearErrors();
                try {
                    d.load(document.getElementById("smiles").value, smiles_converter);
                }
                catch (e) {
                    document.getElementById("error").innerHTML = e;
                }
            };

            window.readonlyChange = function() {
                d.readonly = document.getElementById("readonly-chkbx").checked;
            };

            function humanize(name) {
                return name
                    .replaceAll("_", " ")
                    .replace(/\b\w/g, (s) => s.toUpperCase());
            }

            function createInputRow(input_id, label_text, value, onChange) {
                const li = document.createElement("li");
                const label = document.createElement("label");
                label.htmlFor = input_id;
                label.innerHTML = label_text;
                li.appendChild(label);

                const input = document.createElement("input");
                input.id = input_id;
                if (typeof value === "boolean") {
                    input.type = "checkbox";
                    input.checked = value;
                    input.onchange = () => onChange(input.checked);
                }
                else {
                    input.type = "text";
                    input.className = typeof value === "number" ? "small" : "large";
                    input.value = `${value}`;
                    input.oninput = () => onChange(input.value);
                }
                li.appendChild(input);
                return li;
            }

            function setStyleField(field, rawValue) {
                const current = d.style[field];
                let value = rawValue;
                if (typeof current === "number") {
                    const parsed = parseFloat(`${rawValue}`);
                    if (Number.isNaN(parsed))
                        return;
                    value = parsed;
                }
                const next_style = {
                    ...d.style,
                    themes: d.style.themes.map((t) => ({ ...t })),
                    [field]: value,
                };
                d.style = next_style;
            }

            function setThemeField(field, rawValue) {
                const current_theme = d.theme;
                const current = current_theme[field];
                let value = rawValue;
                if (typeof current === "number") {
                    const parsed = parseFloat(`${rawValue}`);
                    if (Number.isNaN(parsed))
                        return;
                    value = parsed;
                }
                const next_themes = d.style.themes.map((theme) => (
                    theme.name === current_theme.name ? { ...theme, [field]: value } : { ...theme }
                ));
                d.style = { ...d.style, themes: next_themes };
                d.theme = current_theme.name;
            }

            function renderStyleControls() {
                const style_list = document.getElementById("style-controls");
                style_list.innerHTML = "";
                style_fields.forEach((field) => {
                    style_list.appendChild(createInputRow(`style-${field}`, humanize(field), d.style[field], (value) => setStyleField(field, value)));
                });
            }

            function renderThemeControls() {
                const theme_select = document.getElementById("theme-select");
                const theme_list = document.getElementById("theme-controls");
                theme_select.innerHTML = "";
                theme_list.innerHTML = "";
                d.style.themes.forEach((theme) => {
                    const option = document.createElement("option");
                    option.value = theme.name;
                    option.textContent = theme.name;
                    option.selected = theme.name === d.theme.name;
                    theme_select.appendChild(option);
                });
                Object.keys(d.theme)
                    .filter((field) => field !== "name")
                    .forEach((field) => {
                        theme_list.appendChild(createInputRow(`theme-${field}`, humanize(field), d.theme[field], (value) => setThemeField(field, value)));
                    });
            };

            window.themePresetChange = function(el) {
                d.theme = el.value;
                renderThemeControls();
            };

            function clearErrors() {
                document.getElementById("error").innerHTML = "";
            }

            window.clearErrors = clearErrors;

        </script>

        <style type="text/css">
            .wrapper {
                width: 600px;
                margin: 20px 5px;
            }
            p {
                font-family: "Arial", Helvetica, sans-serif;
                font-size: 11pt;
            }
            #chemical {
                width: 600px;
                height: 600px;
                border: solid 1px #ddd;
                position:relative;
            }
            #moltxt {
                width: 600px;
                margin: 20px 5px;
                min-height: 300px;
            }
            .page-wrapper {
                display: flex;
            }
            .column-left {
                flex: 70%;
                padding: 20px 5px 20px 15px;
            }
            .column-right {
                flex: 30%;
                padding: 20px 5px 20px 15px;
                border-left: solid 4px #555;
            }
            .column-right ul {
                padding: 0;
                list-style-type: none;
            }
            .column-right ul li.section {
                font: 12pt "Arial";
                padding-left: 0;
            }
            .column-right ul li {
                padding: 3px 0 3px 12px;
            }

            h2 {
                font: small-caps 12pt "Arial";
            }
            p.descriptors {
                font: 10pt "Arial";
                padding: 0;
                margin: 10px 0 0 0;
            }
            label {
                display: inline-block;
                font: 10pt "Arial";
                color: #555;
                width: 220px;
            }
            input.small {
                width: 40px;
            }
            input.large {
                width: 140px;
            }
            input.smiles {
                width: 300px;
                margin: 20px 5px;
            }
            #error {
                color: red;
            }
            select {
                width: 140px;
            }
            .control-subtitle {
                margin: 8px 0 6px 0;
                font: 11pt "Arial";
                color: #333;
            }

        </style>
    </head>
    <body onload="init()">
        <div class="page-wrapper">
            <div class="column-left">
                <h2>Draw molecule</h2>
                <p>Use mouse. Hover over the atoms, bonds, or empty space, and press spacebar - context menu will open.</p>
                <button onclick="clearDrawing()">Clear</button>
                <input type="checkbox" onchange="readonlyChange()" id="readonly-chkbx" name="readonly"/><label for="readonly-chkbx">Read only</label>
                <p class="descriptors">
                    <span id="mw"></span><br />
                    <span id="composition"></span>
                </p>
                <div id="chemical"></div>
                <div class="wrapper">

                </div>
                <span id="error"></span>
                <h2>Read/write SMILES</h2>
                <div>
                <button onclick="getSmiles()">Get as text</button>
                <button onclick="readSmiles()">Read from text</button>
                </div>
                <input type="text" class="smiles" id="smiles" name="smiles" />
                <h2>Read/write .mol format (ctab)</h2>
                <div>
                <button onclick="getMol()">Get as text</button>
                <button onclick="readMol()">Read from text</button>
                </div>
                <textarea id="moltxt"></textarea>
            </div>
            <div class="column-right">
                <h2>Drawing settings</h2>
                <ul>
                    <li class="section">Theme preset</li>
                    <li>
                        <label for="theme-select">Theme</label>
                        <select id="theme-select" onchange="themePresetChange(this)"></select>
                    </li>
                    <li class="section control-subtitle">Theme properties</li>
                </ul>
                <ul id="theme-controls"></ul>
                <ul>
                    <li class="section control-subtitle">Style properties</li>
                </ul>
                <ul id="style-controls"></ul>
            </div>
            <div style="clear:both"></div>
        </div>
    </body>
</html>
